
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengelola Keuangan Pribadi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fa;
            color: #263238;
            padding: 25px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            margin-bottom: 25px;
        }

        header h1 {
            color: #263b50;
            margin-bottom: 8px;
        }

        header p {
            color: #77818d;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000008;
        }

        .card p {
            color: #77818d;
            margin-bottom: 10px;
        }

        .card h2 {
            color: #247b60;
            font-size: 25px;
        }

        .form-box, .history-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px #00000008;
        }

        h3 {
            margin-bottom: 20px;
            color: #263b50;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce1e7;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #247b60;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add {
            background: #247b60;
            color: white;
            width: 100%;
        }

        .btn-add:hover {
            background: #195c47;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #edf0f3;
        }

        th {
            background: #f4f6fa;
            color: #52616d;
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        .delete-btn {
            background: #ffe8e8;
            color: #d33;
            padding: 8px 12px;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 25px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>💰 Pengelola Keuangan</h1>
        <p>Catat dan pantau pengeluaran uangmu setiap hari.</p>
    </header>

    <!-- Ringkasan -->
    <div class="summary">

        <div class="card">
            <p>Total Pengeluaran</p>
            <h2 id="totalPengeluaran">Rp 0</h2>
        </div>

        <div class="card">
            <p>Jumlah Transaksi</p>
            <h2 id="jumlahTransaksi">0</h2>
        </div>

    </div>

    <!-- Form Input -->
    <div class="form-box">

        <h3>Tambah Pengeluaran</h3>

        <form id="formPengeluaran">

            <div class="form-group">
                <label>Jumlah Pengeluaran (Rp)</label>
                <input
                    type="number"
                    id="jumlah"
                    placeholder="Contoh: 15000"
                    min="1"
                    step="1"
                    required
                >
            </div>

            <div class="form-group">
                <label>Nama Barang</label>
                <input
                    type="text"
                    id="barang"
                    placeholder="Contoh: Nasi goreng"
                    required
                >
            </div>

            <div class="form-group">
                <label>Sumber Uang</label>
                <input
                    type="text"
                    id="sumber"
                    list="daftarSumber"
                    placeholder="Contoh: Uang kakak"
                    required
                >

                <datalist id="daftarSumber">
                    <option value="Uang kakak">
                    <option value="Uang kaleng">
                    <option value="Uang sendiri">
                    <option value="Lain-lain">
                </datalist>
            </div>

            <div class="form-group">
                <label>Tanggal Pengeluaran</label>
                <input
                    type="date"
                    id="tanggal"
                    required
                >
            </div>

            <button type="submit" class="btn-add">
                + Tambahkan Pengeluaran
            </button>

        </form>

    </div>

    <!-- Riwayat -->
    <div class="history-box">

        <h3>Riwayat Pengeluaran</h3>

        <div class="table-wrapper">
            <table>

                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Tanggal</th>
                        <th>Nama Barang</th>
                        <th>Sumber Uang</th>
                        <th>Jumlah</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="daftarPengeluaran">
                </tbody>

            </table>
        </div>

        <div id="pesanKosong" class="empty">
            Belum ada data pengeluaran.
        </div>

    </div>

</div>

<script>

    // Mengambil data dari penyimpanan browser
    let pengeluaran = JSON.parse(
        localStorage.getItem("dataPengeluaran")
    ) || [];

    // Mengambil tanggal hari ini
    function tanggalHariIni() {
        const sekarang = new Date();

        const tahun = sekarang.getFullYear();
        const bulan = String(
            sekarang.getMonth() + 1
        ).padStart(2, "0");

        const hari = String(
            sekarang.getDate()
        ).padStart(2, "0");

        return `${tahun}-${bulan}-${hari}`;
    }

    // Mengatur tanggal awal
    document.getElementById("tanggal").value =
        tanggalHariIni();

    // Format Rupiah
    function formatRupiah(angka) {
        return new Intl.NumberFormat(
            "id-ID",
            {
                style: "currency",
                currency: "IDR",
                maximumFractionDigits: 0
            }
        ).format(angka);
    }

    // Menambahkan pengeluaran
    document.getElementById(
        "formPengeluaran"
    ).addEventListener("submit", function(e) {

        e.preventDefault();

        const jumlah = Number(
            document.getElementById("jumlah").value
        );

        const barang = document.getElementById(
            "barang"
        ).value.trim();

        const sumber = document.getElementById(
            "sumber"
        ).value.trim();

        const tanggal = document.getElementById(
            "tanggal"
        ).value;

        if (
            !Number.isSafeInteger(jumlah) ||
            jumlah <= 0 ||
            !barang ||
            !sumber ||
            !tanggal
        ) {
            alert("Mohon isi semua data dengan benar!");
            return;
        }

        const dataBaru = {
            id: Date.now(),
            jumlah: jumlah,
            barang: barang,
            sumber: sumber,
            tanggal: tanggal
        };

        pengeluaran.push(dataBaru);

        simpanData();
        tampilkanData();

        // Mengosongkan form setelah disimpan
        this.reset();

        // Mengatur kembali tanggal hari ini
        document.getElementById("tanggal").value =
            tanggalHariIni();

    });

    // Menyimpan data ke localStorage
    function simpanData() {
        localStorage.setItem(
            "dataPengeluaran",
            JSON.stringify(pengeluaran)
        );
    }

    // Menampilkan seluruh data
    function tampilkanData() {

        const tabel = document.getElementById(
            "daftarPengeluaran"
        );

        const pesanKosong = document.getElementById(
            "pesanKosong"
        );

        tabel.innerHTML = "";

        // Mengurutkan dari tanggal terbaru
        const dataUrut = [...pengeluaran].sort(
            (a, b) =>
                b.tanggal.localeCompare(a.tanggal) ||
                b.id - a.id
        );

        let total = 0;

        dataUrut.forEach((data, index) => {

            total += data.jumlah;

            const tanggalFormat =
                new Date(
                    data.tanggal + "T00:00:00"
                ).toLocaleDateString("id-ID", {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                });

            const baris = document.createElement("tr");

            const nilai = [
                index + 1,
                tanggalFormat,
                data.barang,
                data.sumber,
                formatRupiah(data.jumlah)
            ];

            nilai.forEach(teks => {
                const kolom = document.createElement("td");
                kolom.textContent = teks;
                baris.appendChild(kolom);
            });

            const kolomAksi = document.createElement("td");

            const tombol = document.createElement("button");
            tombol.textContent = "Hapus";
            tombol.className = "delete-btn";

            tombol.addEventListener("click", function() {
                hapusData(data.id);
            });

            kolomAksi.appendChild(tombol);
            baris.appendChild(kolomAksi);

            tabel.appendChild(baris);

        });

        // Memperbarui ringkasan
        document.getElementById(
            "totalPengeluaran"
        ).textContent = formatRupiah(total);

        document.getElementById(
            "jumlahTransaksi"
        ).textContent = pengeluaran.length;

        // Menampilkan pesan jika belum ada data
        pesanKosong.style.display =
            pengeluaran.length === 0 ? "block" : "none";

    }

    // Menghapus data
    function hapusData(id) {

        const yakin = confirm(
            "Apakah kamu yakin ingin menghapus transaksi ini?"
        );

        if (!yakin) return;

        pengeluaran = pengeluaran.filter(
            data => data.id !== id
        );

        simpanData();
        tampilkanData();

    }

    // Menampilkan data ketika website dibuka
    tampilkanData();

</script>

</body>
</html>
