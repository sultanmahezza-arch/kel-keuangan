<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengelola Keuangan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      padding: 24px 16px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 20px; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .card h2 { font-size: 1.1rem; margin-bottom: 14px; }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    label { display: block; font-size: .85rem; margin-bottom: 4px; color: #4b5563; }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }
    input:focus, select:focus { outline: 2px solid #3b82f6; border-color: #3b82f6; }
    button.add {
      margin-top: 14px;
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button.add:hover { background: #1d4ed8; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .box { background: #eff6ff; border-radius: 10px; padding: 14px; }
    .box small { color: #6b7280; }
    .box strong { display: block; font-size: 1.25rem; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: .95rem; }
    th { background: #f9fafb; }
    .right { text-align: right; }
    .del { background: #ef4444; color: #fff; border: none; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    .del:hover { background: #dc2626; }
    .empty { text-align: center; color: #9ca3af; padding: 20px; }
    .table-wrap { overflow-x: auto; }
    .reset { margin-top: 12px; background: none; border: 1px solid #ef4444; color: #ef4444; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    .reset:hover { background: #fef2f2; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💰 Pengelola Keuangan</h1>

    <!-- FORM INPUT -->
    <div class="card">
      <h2>Tambah Pengeluaran</h2>
      <div class="form-row">
        <div>
          <label for="namaBarang">Nama Barang</label>
          <input type="text" id="namaBarang" placeholder="Contoh: Makan siang" />
        </div>
        <div>
          <label for="jumlah">Jumlah Pengeluaran (Rp)</label>
          <input type="number" id="jumlah" placeholder="Contoh: 15000" min="0" />
        </div>
        <div>
          <label for="sumber">Sumber Uang</label>
          <select id="sumber">
            <option value="Uang Kaleng">Uang Kaleng</option>
            <option value="Uang Kakak">Uang Kakak</option>
            <option value="lain">Lain-lain (ketik sendiri)</option>
          </select>
          <input type="text" id="sumberLain" placeholder="Ketik sumber uang..." style="display:none; margin-top:8px;" />
        </div>
      </div>
      <button class="add" id="btnTambah">Tambah</button>
    </div>

    <!-- RINGKASAN -->
    <div class="card">
      <h2>Ringkasan</h2>
      <div class="summary">
        <div class="box"><small>Total Pengeluaran</small><strong id="totalPengeluaran">Rp 0</strong></div>
        <div class="box"><small>Jumlah Transaksi</small><strong id="jumlahTransaksi">0</strong></div>
      </div>
      <h2 style="margin-top:18px;">Pengeluaran per Sumber Uang</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Sumber Uang</th><th class="right">Total</th></tr></thead>
          <tbody id="tabelSumber"></tbody>
        </table>
      </div>
    </div>

    <!-- DAFTAR HASIL -->
    <div class="card">
      <h2>Daftar Pengeluaran</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Tanggal</th>
              <th>Nama Barang</th>
              <th>Sumber Uang</th>
              <th class="right">Jumlah</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelData"></tbody>
        </table>
      </div>
      <button class="reset" id="btnReset">Hapus Semua Data</button>
    </div>
  </div>

  <script>
    const KUNCI = "dataKeuangan";
    let data = JSON.parse(localStorage.getItem(KUNCI)) || [];

    const inputNama = document.getElementById("namaBarang");
    const inputJumlah = document.getElementById("jumlah");
    const inputSumber = document.getElementById("sumber");
    const inputSumberLain = document.getElementById("sumberLain");

    // Tampilkan kolom ketik hanya jika memilih "Lain-lain"
    inputSumber.addEventListener("change", () => {
      const lain = inputSumber.value === "lain";
      inputSumberLain.style.display = lain ? "block" : "none";
      if (lain) inputSumberLain.focus();
    });

    function rupiah(angka) {
      return "Rp " + Number(angka).toLocaleString("id-ID");
    }

    function simpan() {
      localStorage.setItem(KUNCI, JSON.stringify(data));
    }

    function tambah() {
      const nama = inputNama.value.trim();
      const jumlah = parseFloat(inputJumlah.value);
      const sumber = inputSumber.value === "lain"
        ? inputSumberLain.value.trim()
        : inputSumber.value;

      if (!nama || !sumber || isNaN(jumlah) || jumlah <= 0) {
        alert("Lengkapi semua kolom dengan benar ya (jumlah harus lebih dari 0).");
        return;
      }

      data.push({
        id: Date.now(),
        tanggal: new Date().toLocaleDateString("id-ID"),
        nama,
        jumlah,
        sumber
      });

      simpan();
      inputNama.value = "";
      inputJumlah.value = "";
      inputSumber.value = "Uang Kaleng";
      inputSumberLain.value = "";
      inputSumberLain.style.display = "none";
      inputNama.focus();
      tampilkan();
    }

    function hapus(id) {
      data = data.filter(item => item.id !== id);
      simpan();
      tampilkan();
    }

    function resetSemua() {
      if (data.length && confirm("Yakin ingin menghapus semua data?")) {
        data = [];
        simpan();
        tampilkan();
      }
    }

    function tampilkan() {
      // Daftar pengeluaran
      const tbody = document.getElementById("tabelData");
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">Belum ada data pengeluaran.</td></tr>';
      } else {
        tbody.innerHTML = data.map((item, i) => `
          <tr>
            <td>${i + 1}</td>
            <td>${item.tanggal}</td>
            <td>${escapeHtml(item.nama)}</td>
            <td>${escapeHtml(item.sumber)}</td>
            <td class="right">${rupiah(item.jumlah)}</td>
            <td><button class="del" onclick="hapus(${item.id})">Hapus</button></td>
          </tr>
        `).join("");
      }

      // Ringkasan total
      const total = data.reduce((sum, item) => sum + item.jumlah, 0);
      document.getElementById("totalPengeluaran").textContent = rupiah(total);
      document.getElementById("jumlahTransaksi").textContent = data.length;

      // Ringkasan per sumber
      const perSumber = {};
      data.forEach(item => {
        const kunci = item.sumber;
        perSumber[kunci] = (perSumber[kunci] || 0) + item.jumlah;
      });
      const tbodySumber = document.getElementById("tabelSumber");
      const daftar = Object.entries(perSumber);
      if (daftar.length === 0) {
        tbodySumber.innerHTML = '<tr><td colspan="2" class="empty">Belum ada data.</td></tr>';
      } else {
        tbodySumber.innerHTML = daftar.map(([sumber, jml]) => `
          <tr><td>${escapeHtml(sumber)}</td><td class="right">${rupiah(jml)}</td></tr>
        `).join("");
      }
    }

    // Mencegah teks input dibaca sebagai HTML
    function escapeHtml(teks) {
      const div = document.createElement("div");
      div.textContent = teks;
      return div.innerHTML;
    }

    document.getElementById("btnTambah").addEventListener("click", tambah);
    document.getElementById("btnReset").addEventListener("click", resetSemua);
    [inputNama, inputJumlah, inputSumber, inputSumberLain].forEach(el =>
      el.addEventListener("keydown", e => { if (e.key === "Enter") tambah(); })
    );

    tampilkan();
  </script>
</body>
</html>
